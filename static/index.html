<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitBook to PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>GitBook to PDF</h1>
        <p class="subtitle">Convert any GitBook into a downloadable PDF</p>

        <form id="convert-form">
            <div class="input-group">
                <input
                    type="url"
                    id="url-input"
                    placeholder="https://your-gitbook.gitbook.io"
                    required
                    autocomplete="url"
                >
                <button type="submit" id="submit-btn">Convert</button>
            </div>
            <label class="toggle-row" for="subpages-toggle">
                <span class="toggle-label">Include subpages</span>
                <input type="checkbox" id="subpages-toggle" class="toggle-input">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </label>
        </form>

        <div id="status" hidden>
            <div id="status-header">
                <span id="spinner" class="spinner"></span>
                <span id="status-text">Converting...</span>
            </div>
            <pre id="log"></pre>
            <a id="download-btn" class="download-btn disabled" hidden download>Download PDF</a>
        </div>

        <div id="error-msg" class="error" hidden></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
